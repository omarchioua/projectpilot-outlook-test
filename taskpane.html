<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectPilot Outlook-test</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>body{font-family:Segoe UI,Arial,sans-serif;margin:22px;color:#172033}h1{font-size:22px}button{background:#155eef;color:white;border:0;padding:12px 16px;border-radius:7px;cursor:pointer}#subject{background:#f2f5fa;border-radius:7px;padding:12px;overflow-wrap:anywhere}#status{color:#526176}</style></head><body><h1>🏗️ ProjectPilot — test</h1><p id="status">Outlook-verbinding controleren…</p><p><strong>Onderwerp van de geopende e-mail:</strong></p><p id="subject">Nog niet geladen</p><button id="refresh" type="button">Onderwerp opnieuw lezen</button><p><small>Deze test leest alleen het onderwerp in je Outlook-venster. Er wordt niets verzonden of extern opgeslagen.</small></p><script>function readSubject(){const s=document.getElementById('subject');const status=document.getElementById('status');try{const item=Office.context.mailbox&&Office.context.mailbox.item;if(!item){status.textContent='Open eerst een ontvangen e-mail en probeer opnieuw.';s.textContent='Geen geopende e-mail';return;}const subject=item.subject;if(typeof subject==='string'){s.textContent=subject||'(leeg onderwerp)';status.textContent='Verbonden met Outlook ✓';}else if(subject&&typeof subject.getAsync==='function'){subject.getAsync(function(result){if(result.status===Office.AsyncResultStatus.Succeeded){s.textContent=result.value||'(leeg onderwerp)';status.textContent='Verbonden met Outlook ✓';}else{status.textContent='Kon onderwerp niet lezen: '+(result.error?.message||'onbekende fout');}});}else{status.textContent='Onderwerp is in deze Outlook-weergave niet beschikbaar.';}}catch(e){status.textContent='Fout: '+e.message;}}Office.onReady(function(info){if(info.host===Office.HostType.Outlook){readSubject();}else{document.getElementById('status').textContent='Open dit paneel vanuit Outlook.';}});document.getElementById('refresh').addEventListener('click',readSubject);</script></body></html>
